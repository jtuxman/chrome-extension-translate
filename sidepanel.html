<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi vocabulario</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="cabecera">
      <div class="titulo">
        <h1>Mi vocabulario</h1>
        <div class="letra">
          <button id="letraMenos" type="button" title="Letra más pequeña">A−</button>
          <button id="letraMas" type="button" title="Letra más grande">A+</button>
        </div>
      </div>
      <div class="acciones">
        <button
          id="activar"
          class="btn-activar"
          type="button"
          role="switch"
          aria-checked="true"
          title="Activar o desactivar la traducción al seleccionar texto"
        >
          <span class="estado-activar">Encendido</span>
          <span class="pista" aria-hidden="true"><span class="interruptor"></span></span>
        </button>
        <span id="racha" class="racha-chip" title="Días seguidos practicando">🔥 0</span>
        <span id="contador" class="contador">0 palabras</span>
        <button id="jugar" class="btn-jugar" title="Jugar">
          Jugar
        </button>
        <button id="ajustes" class="btn-ajustes" title="Ajustes">
          Ajustes
        </button>
      </div>
    </header>

    <input
      id="buscar"
      class="buscar"
      type="search"
      placeholder="Buscar palabra…"
    />

    <div class="paginacion">
      <button id="paginaAnterior" class="btn-pagina" type="button">Anterior</button>
      <span id="paginaInfo">Página 1 de 1</span>
      <button id="paginaSiguiente" class="btn-pagina" type="button">Siguiente</button>
    </div>

    <div class="periodos" role="group" aria-label="Filtrar por fecha">
      <button type="button" class="btn-periodo activo" data-periodo="todas">Todas</button>
      <button type="button" class="btn-periodo" data-periodo="semana">Semana</button>
      <button type="button" class="btn-periodo" data-periodo="mes">Mes</button>
      <button type="button" class="btn-periodo" data-periodo="tres">3 meses</button>
    </div>

    <ul id="lista" class="lista"></ul>

    <p id="vacio" class="vacio">
      Selecciona una palabra en inglés en cualquier página para empezar a
      construir tu vocabulario.
    </p>

    <footer class="pie">
      <div class="drive">
        <p id="driveEstado" class="drive-estado">Comprobando Google Drive…</p>
        <div class="drive-botones">
          <button id="driveConectar" class="btn-google" type="button" hidden>
            Continuar con Google
          </button>
          <button id="driveDesconectar" class="btn-pie" type="button" hidden>
            Desconectar
          </button>
        </div>
      </div>
      <div class="pie-fila">
        <button id="exportar" class="btn-pie" type="button">Exportar JSON</button>
        <button id="importar" class="btn-pie" type="button">Importar JSON</button>
        <input id="archivoImport" type="file" accept="application/json" hidden />
      </div>
    </footer>

    <button id="borrarTodo" class="btn-borrar-todo" type="button" title="Borrar todo">
      Vaciar
    </button>

    <script src="sidepanel.js"></script>
  </body>
</html>
