<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi vocabulario</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="cabecera">
      <h1>Mi vocabulario</h1>
      <div class="acciones">
        <span id="contador" class="contador">0 palabras</span>
        <button id="jugar" class="btn-jugar" title="Jugar">
          Jugar
        </button>
        <button id="ajustes" class="btn-ajustes" title="Ajustes">
          Ajustes
        </button>
        <button id="borrarTodo" class="btn-borrar-todo" title="Borrar todo">
          Vaciar
        </button>
      </div>
    </header>

    <input
      id="buscar"
      class="buscar"
      type="search"
      placeholder="Buscar palabra…"
    />

    <ul id="lista" class="lista"></ul>

    <p id="vacio" class="vacio">
      Selecciona una palabra en inglés en cualquier página para empezar a
      construir tu vocabulario.
    </p>

    <footer class="pie">
      <button id="exportar" class="btn-pie">Exportar JSON</button>
      <button id="importar" class="btn-pie">Importar JSON</button>
      <input id="archivoImport" type="file" accept="application/json" hidden />
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
